name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src

      - name: Lint
        run: selene src

      - name: Install Luau
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.650/luau-ubuntu.zip
          unzip -q luau.zip -d luau-bin

      - name: Tests
        run: python3 tests/run.py ./luau-bin/luau
